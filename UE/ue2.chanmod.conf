# UE2 with RFsim channel model (downlink, applied on the UE side).
# Same as ue2.conf plus a channelmod section. Model names to be confirmed in simulator.cpp:345.
@include "ue2.conf"

channelmod = {
  max_chan  = 10;
  modellist = "modellist_ue2";
  modellist_ue2 = (
    { # downlink from DU1 (RU 0)
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 10;
      noise_power_dB = -19;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    { # downlink from DU2 (RU 1)
      model_name     = "rfsimu_channel_enB1";
      type           = "AWGN";
      ploss_dB       = 10;
      noise_power_dB = -19;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};