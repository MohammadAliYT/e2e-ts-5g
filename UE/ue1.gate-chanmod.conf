# UE1 for gate run 2b: one radio (RFsim server) + one channel model per connected DU.
# On the server side the model name is rfsimu_channel_ue<N>, N = connection order
# (simulator.cpp:347): ue0 = DU1 (connects first), ue1 = DU2 (connects after UE1 is attached).
# DU2 arrives 10 dB weaker than DU1, like a neighbour at a real cell edge.
# Noise belongs to the receiver, so it is added once (on DU1's link); DU2's link adds almost none.
@include "ue1.gate.conf"

channelmod = {
  max_chan  = 10;
  modellist = "modellist_gate";
  modellist_gate = (
    { # downlink from DU1 (first connection) - same values as the UE2 chanmod tests
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 10;
      noise_power_dB = -19;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    { # downlink from DU2 (second connection) - 10 dB weaker
      model_name     = "rfsimu_channel_ue1";
      type           = "AWGN";
      ploss_dB       = 20;
      noise_power_dB = -40;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};