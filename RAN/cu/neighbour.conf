nr_measurement_configuration = {
  Periodical = {                     # the controller's main input
    enable = 1;
    includeBeamMeasurements = 1;
    maxNrofRS_IndexesToReport = 4;
  };
  A2 = {                             # serving worse than threshold: report only
    enable = 1;
    threshold = 60;
    time_to_trigger = 1;
  };
  A3 = ({                            # cannot be disabled; high offset so OAI rarely hands over by itself
    physCellId = -1;
    offset = 30;
    hysteresis = 0;
    time_to_trigger = 1;
  });
};