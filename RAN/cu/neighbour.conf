# DU1: gNB 0xe00, cell 12345678, PCI 0, SSB 630048 | DU2: gNB 0xe01, cell 11111111, PCI 1, SSB 643296

sib2_config : {
  q_Hyst                   = 0;
  cellReselectionPriority  = 5;
  threshServingLowP        = 0;
  threshServingLowQ        = 0;
  s_NonIntraSearchP        = -1;
  s_NonIntraSearchQ        = -1;
  q_RxLevMin               = -56;
  q_QualMin                = -1;
  s_IntraSearchP           = 22;
  s_IntraSearchQ           = -1;
  t_ReselectionNR          = 1;
  deriveSSB_IndexFromCell  = 1;
  speed_t_Evaluation       = 0;
  speed_t_HystNormal       = 0;
  speed_n_CellChangeMedium = 1;
  speed_n_CellChangeHigh   = 2;
  speed_sf_Medium          = 1;
  speed_sf_High            = 0;
};

