# claude suggests: SIB4 per-frequency fields sit directly in each entry, so gnb_config.c reads gNBs.[0].frequency_list.[i], not .frequency_config
# SIB4 per-frequency fields sit directly in each entry:
# gnb_config.c reads gNBs.[0].frequency_list.[i], not .frequency_config
frequency_list = (
  {
    absoluteFrequencySSB    = 643296;   # DU2
    subcarrierSpacing       = 1;
    band                    = 78;
    cellReselectionPriority = 5;
    threshX_HighP           = 10;
    threshX_LowP            = 6;
    threshX_HighQ           = -1;
    threshX_LowQ            = -1;
    q_OffsetFreq            = 0;
    q_RxLevMin              = -56;
    t_ReselectionNR         = 1;
  },
  {
    absoluteFrequencySSB    = 630048;   # DU1
    subcarrierSpacing       = 1;
    band                    = 78;
    cellReselectionPriority = 5;
    threshX_HighP           = 10;
    threshX_LowP            = 6;
    threshX_HighQ           = -1;
    threshX_LowQ            = -1;
    q_OffsetFreq            = 0;
    q_RxLevMin              = -56;
    t_ReselectionNR         = 1;
  }
);

neighbour_list = (
  {
    nr_cellid = 12345678;            # serving: DU1
    neighbour_cell_configuration = ({
      gNB_ID               = 0xe01;
      nr_cellid            = 11111111;
      physical_cellId      = 1;
      absoluteFrequencySSB = 643296;
      subcarrierSpacing    = 1;
      band                 = 78;
      plmn                 = { mcc = 208; mnc = 93; mnc_length = 2 };
      tracking_area_code   = 1;
      q_OffsetCell         = 0;
      q_RxLevMinOffsetCell = -1;
      q_QualMinOffsetCell  = -1;
    });
  },
  {
    nr_cellid = 11111111;            # serving: DU2
    neighbour_cell_configuration = ({
      gNB_ID               = 0xe00;
      nr_cellid            = 12345678;
      physical_cellId      = 0;
      absoluteFrequencySSB = 630048;
      subcarrierSpacing    = 1;
      band                 = 78;
      plmn                 = { mcc = 208; mnc = 93; mnc_length = 2 };
      tracking_area_code   = 1;
      q_OffsetCell         = 0;
      q_RxLevMinOffsetCell = -1;
      q_QualMinOffsetCell  = -1;
    });
